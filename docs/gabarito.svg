  <text x="72" y="49" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">GABARITO</text>
  <rect x="224" y="31" width="44" height="20" rx="4" fill="#FACC15" />
  <text x="230" y="45" fill="#0F172A" font-family=" monospace" font-size="12" font-weight="900">PRO</text>
