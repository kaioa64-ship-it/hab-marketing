<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Fundo do Ícone (Esquadro Industrial) -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2" />
  
  <!-- Marcas de Corte / Esquadro de Precisão nos 4 Cantos -->
  <path d="M12 20V12H20" stroke="#FACC15" stroke-width="3" stroke-linecap="round" />
  <path d="M44 12H52V20" stroke="#FACC15" stroke-width="3" stroke-linecap="round" />
  <path d="M12 44V52H20" stroke="#FACC15" stroke-width="3" stroke-linecap="round" />
  <path d="M44 52H52V44" stroke="#FACC15" stroke-width="3" stroke-linecap="round" />

  <!-- Letra G Geométrica Central + Check de Conformidade -->
